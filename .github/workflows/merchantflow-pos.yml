name: CI/CD Pipeline - MerchantFlowPOS

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/MerchantFlowPOS/**'
      - '.github/workflows/merchantflow-pos.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/MerchantFlowPOS/**'

defaults:
  run:
    working-directory: apps/MerchantFlowPOS

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/MerchantFlowPOS/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

  build-web:
    name: Build Web Distribution
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/MerchantFlowPOS/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Export Web
        run: npx expo export --platform web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-web-dist
          path: apps/MerchantFlowPOS/dist/

  build-android:
    name: Android Preview (EAS Build)
    if: github.ref == 'refs/heads/main'
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node & EAS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global eas-cli
      # - name: Trigger EAS Build
      #   run: eas build --platform android --non-interactive
      #   env:
      #     EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
