name: CI/CD Pipeline - MerchantFlowPOS

on:
  push:
    branches: [ main, preview ]
    paths:
      - 'apps/MerchantFlowPOS/**'
      - '.github/workflows/merchantflow-pos.yml'
  pull_request:
    branches: [ main, preview ]
    paths:
      - 'apps/MerchantFlowPOS/**'

defaults:
  run:
    working-directory: apps/MerchantFlowPOS

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/MerchantFlowPOS/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

  build-web:
    name: Build Web Distribution
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/MerchantFlowPOS/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Export Web
        run: npx expo export --platform web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-web-dist
          path: apps/MerchantFlowPOS/dist/

  build-android:
    name: Build Android (${{ github.ref == 'refs/heads/main' && 'Production AAB' || 'Preview APK' }})
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preview'
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/MerchantFlowPOS/package-lock.json

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci

      - name: Determine EAS Profile
        id: profile
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "eas_profile=production" >> $GITHUB_OUTPUT
          else
            echo "eas_profile=preview" >> $GITHUB_OUTPUT
          fi

      - name: Run EAS Build
        run: eas build --platform android --profile ${{ steps.profile.outputs.eas_profile }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
